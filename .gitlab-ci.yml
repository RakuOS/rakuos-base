# ============================================================
# RakuOS Base Image — GitLab CI/CD Pipeline
# ============================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

variables:
  IMAGE_REGISTRY: "registry.gitlab.com/rakuos/images/rakuos-base"
  IMAGE_REGISTRY_NVIDIA: "registry.gitlab.com/rakuos/images/rakuos-base/nvidia"
  IMAGE_REGISTRY_QUAY: "quay.io/rakuos/rakuos-base"
  IMAGE_REGISTRY_QUAY_NVIDIA: "quay.io/rakuos/rakuos-base-nvidia"
  IMAGE_REGISTRY_QUAY_V4: "quay.io/rakuos/rakuos-base-v4"
  IMAGE_REGISTRY_QUAY_NVIDIA_V4: "quay.io/rakuos/rakuos-base-nvidia-v4"
  IMAGE_REGISTRY_QUAY_V3: "quay.io/rakuos/rakuos-base-v3"
  IMAGE_REGISTRY_QUAY_NVIDIA_V3: "quay.io/rakuos/rakuos-base-nvidia-v3"
  IMAGE_REGISTRY_QUAY_MINIMAL: "quay.io/rakuos/rakuos-minimal"
  IMAGE_REGISTRY_QUAY_MINIMAL_NVIDIA: "quay.io/rakuos/rakuos-minimal-nvidia"
  IMAGE_REGISTRY_QUAY_MINIMAL_V4: "quay.io/rakuos/rakuos-minimal-v4"
  IMAGE_REGISTRY_QUAY_MINIMAL_NVIDIA_V4: "quay.io/rakuos/rakuos-minimal-nvidia-v4"
  IMAGE_REGISTRY_QUAY_MINIMAL_V3: "quay.io/rakuos/rakuos-minimal-v3"
  IMAGE_REGISTRY_QUAY_MINIMAL_NVIDIA_V3: "quay.io/rakuos/rakuos-minimal-nvidia-v3"
  IMAGE_DESC: "RakuOS Base"
  IMAGE_KEYWORDS: "bootc,fedora,atomic"
  DEFAULT_TAG: "latest"

stages:
  - build-push-base
  - build-push-nvidia
  - test
  - sign
  - dispatch

.buildah-job:
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  before_script:
    - |
      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}")
          export FEDORA_VERSION="44"
          export BRANCH_SLUG="${DEFAULT_TAG}"
          ;;
        "staging")
          export FEDORA_VERSION="44"
          export BRANCH_SLUG="staging"
          ;;
        "rawhide")
          export FEDORA_VERSION="rawhide"
          export BRANCH_SLUG="rawhide"
          ;;
        "rakuosel")
          # Temporary until this branch switches to the CentOS Stream flow.
          export FEDORA_VERSION="10"
          export BRANCH_SLUG="rakuosel"
          ;;
        *)
          export FEDORA_VERSION="45"
          export BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          ;;
      esac
      # Passed to build-v3.sh/build-v4.sh as RAKUOS_STAGING via --build-arg
      # so they install rakuos-release-staging instead of rakuos-release on
      # the staging branch.
      if [ "${CI_COMMIT_BRANCH}" = "staging" ]; then
        export RAKUOS_STAGING="1"
      else
        export RAKUOS_STAGING="0"
      fi
      echo "Building with FEDORA_VERSION=${FEDORA_VERSION}"
      echo "Using branch slug: ${BRANCH_SLUG}"
      echo "RAKUOS_STAGING=${RAKUOS_STAGING}"
    - export DATE_TAG="$(date -u +%Y%m%d)"
    - dnf install -y --quiet jq
  variables:
    STORAGE_DRIVER: overlay
    BUILDAH_FORMAT: oci

build-push-base:
  extends: .buildah-job
  stage: build-push-base
  script:
    - printf 'TAGS=\nBRANCH_SLUG=\n' > build-base.env

    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        TAGS="${IMAGE_REGISTRY}:${DEFAULT_TAG} ${IMAGE_REGISTRY}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY}:${DATE_TAG}"
        QUAY_TAGS="${IMAGE_REGISTRY_QUAY}:${DEFAULT_TAG} ${IMAGE_REGISTRY_QUAY}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY_QUAY}:${DATE_TAG}"
      else
        TAGS="${IMAGE_REGISTRY}:${BRANCH_SLUG} ${IMAGE_REGISTRY}:${BRANCH_SLUG}.${DATE_TAG}"
        QUAY_TAGS="${IMAGE_REGISTRY_QUAY}:${BRANCH_SLUG} ${IMAGE_REGISTRY_QUAY}:${BRANCH_SLUG}.${DATE_TAG}"
      fi
      export TAGS QUAY_TAGS BRANCH_SLUG
      printf 'TAGS=%s\nBRANCH_SLUG=%s\n' "${TAGS}" "${BRANCH_SLUG}" > build-base.env

    - export TEMP_TAG="${IMAGE_REGISTRY_QUAY}:ci-temp-${CI_PIPELINE_ID}"

    - |
      MOK_SECRET_FLAG=""
      SECURE_FILE_ID=$(curl --silent \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/secure_files" \
          | jq -r '.[] | select(.name == "MOK.key") | .id' 2>/dev/null || true)
      if [[ -n "${SECURE_FILE_ID}" ]] && [[ "${SECURE_FILE_ID}" != "null" ]]; then
          curl --silent \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              -o /tmp/MOK.key \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/secure_files/${SECURE_FILE_ID}/download"
          chmod 600 /tmp/MOK.key
          MOK_SECRET_FLAG="--secret id=mok_key,src=/tmp/MOK.key"
          echo "MOK.key downloaded — modules will be signed"
      else
          echo "MOK.key not found in Secure Files — skipping module signing"
      fi

    - |
      buildah build \
        --file Containerfile \
        --build-arg FEDORA_VERSION="${FEDORA_VERSION}" \
        --build-arg RAKUOS_STAGING="${RAKUOS_STAGING}" \
        --skip-unused-stages=false \
        -v "$(pwd)":/run/src --security-opt=label=disable \
        ${MOK_SECRET_FLAG} \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.version=${BRANCH_SLUG}.${DATE_TAG}" \
        --label "org.opencontainers.image.description=${IMAGE_DESC}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.vendor=RakuOS" \
        --label "org.opencontainers.image.keywords=${IMAGE_KEYWORDS}" \
        --label "containers.bootc=1" \
        --tag "${TEMP_TAG}" \
        .

    - |
      if [ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]; then
        buildah login -u "${QUAY_USER}" -p "${QUAY_TOKEN}" quay.io
        if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
          PRIMARY_QUAY_TAG="${IMAGE_REGISTRY_QUAY}:${DEFAULT_TAG}"
          ALIAS_TAGS="${DEFAULT_TAG}.${DATE_TAG} ${DATE_TAG}"
        else
          PRIMARY_QUAY_TAG="${IMAGE_REGISTRY_QUAY}:${BRANCH_SLUG}"
          ALIAS_TAGS="${BRANCH_SLUG}.${DATE_TAG}"
        fi
        echo "Pushing ${PRIMARY_QUAY_TAG}"
        buildah push --compression-format zstd:chunked "${TEMP_TAG}" "docker://${PRIMARY_QUAY_TAG}"
        REPO_PATH="${IMAGE_REGISTRY_QUAY#quay.io/}"
        PRIMARY_TAG_NAME="${PRIMARY_QUAY_TAG##*:}"
        DIGEST=$(curl -sf \
          -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
          "https://quay.io/api/v1/repository/${REPO_PATH}/tag/?specificTag=${PRIMARY_TAG_NAME}&limit=1" \
          | jq -r '.tags[0].manifest_digest')
        echo "Manifest digest: ${DIGEST}"
        for alias in ${ALIAS_TAGS}; do
          echo "Aliasing :${alias} → ${DIGEST}"
          curl -sf -X PUT \
            -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"manifest_digest\": \"${DIGEST}\"}" \
            "https://quay.io/api/v1/repository/${REPO_PATH}/tag/${alias}"
        done
        echo "All tags pushed and aliased."
      fi
  artifacts:
    reports:
      dotenv: build-base.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

