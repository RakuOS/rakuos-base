trigger-downstream:
  stage: dispatch
  image: curlimages/curl:latest
  needs:
    - job: sign-image-standard
      artifacts: false
    - job: sign-image-nvidia
      artifacts: false
    - job: sign-image-standard-v4
      artifacts: false
    - job: sign-image-nvidia-v4
      artifacts: false
    - job: sign-image-standard-v3
      artifacts: false
    - job: sign-image-nvidia-v3
      artifacts: false
  script:
    - |
      trigger_pipeline() {
        token="$1"
        project_id="$2"

        echo "Triggering project_id=${project_id} ref=${CI_COMMIT_BRANCH}"

        curl --fail-with-body -X POST \
          --form "token=${token}" \
          --form "ref=${CI_COMMIT_BRANCH}" \
          "https://gitlab.com/api/v4/projects/${project_id}/trigger/pipeline"
      }

      trigger_pipeline "${TRIGGER_TOKEN_KDE}" "${PROJECT_ID_KDE}"
      trigger_pipeline "${TRIGGER_TOKEN_GNOME}" "${PROJECT_ID_GNOME}"
      trigger_pipeline "${TRIGGER_TOKEN_COSMIC}" "${PROJECT_ID_COSMIC}"
      trigger_pipeline "${TRIGGER_TOKEN_NIRI}" "${PROJECT_ID_NIRI}"
      # minimal is now built directly in this pipeline (build-push-minimal*
      # jobs above) instead of as a separate downstream project.
      # gamescope is based on the kde image, not directly on base — kde's
      # own dispatch stage triggers it once the kde image itself has
      # finished building, so it isn't triggered from here anymore.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

notify-discord-minimal:
  stage: dispatch
  image: curlimages/curl:latest
  needs:
    - job: sign-image-standard
      optional: true
    - job: sign-image-nvidia
      optional: true
    - job: sign-image-standard-v4
      optional: true
    - job: sign-image-standard-v3
      optional: true
    - job: sign-image-nvidia-v4
      optional: true
    - job: sign-image-nvidia-v3
      optional: true
    - job: sign-image-minimal
      optional: true
    - job: sign-image-minimal-v4
      optional: true
    - job: sign-image-minimal-v3
      optional: true
    - job: sign-image-minimal-nvidia
      optional: true
    - job: sign-image-minimal-nvidia-v4
      optional: true
    - job: sign-image-minimal-nvidia-v3
      optional: true
  script:
    - |
      set -euo pipefail
      : "${WEBSITE_CI_API_TOKEN:?set WEBSITE_CI_API_TOKEN in CI/CD variables}"
      : "${WEBSITE_HOST:?set WEBSITE_HOST in CI/CD variables}"
      DATE_TAG="$(date -u +%Y%m%d)"

      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}") CHANNEL="main"; PRIMARY_TAG_NAME="${DEFAULT_TAG}" ;;
        "staging")              CHANNEL="staging"; PRIMARY_TAG_NAME="staging"     ;;
        "rakuosel")             CHANNEL="main"; PRIMARY_TAG_NAME="rakuosel"       ;;
        *) echo "No Discord channel configured for branch '${CI_COMMIT_BRANCH}', skipping."; exit 0 ;;
      esac

      PAYLOAD="{\"channel\": \"${CHANNEL}\", \"name\": \"rakuos-minimal\", \"version\": \"${PRIMARY_TAG_NAME}.${DATE_TAG}\"}"
      curl -sS -f -X POST -H "Authorization: Bearer ${WEBSITE_CI_API_TOKEN}" -H "Content-Type: application/json" -d "${PAYLOAD}" "http://${WEBSITE_HOST}:8080/api/image-update"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
      when: on_success
