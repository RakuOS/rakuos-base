.trigger-on-test-fail:
  stage: test
  image: quay.io/fedora/fedora:latest
  tags:
    - saas-linux-2xlarge-amd64
  allow_failure: true
  script:
    - |
      set -euo pipefail
      dnf install -y curl
      echo "Re-triggering ${CI_PROJECT_NAME} pipeline on ${CI_COMMIT_BRANCH}..."
      curl -sf -X POST \
        --form "token=${TRIGGER_TOKEN_BASE}" \
        --form "ref=${CI_COMMIT_BRANCH}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/trigger/pipeline"
      echo "Pipeline re-triggered."
      echo "Cancelling own pipeline ${CI_PIPELINE_ID}..."
      curl -sf -X POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/cancel" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
      when: on_failure

trigger-on-image-standard-fail:
  extends: .trigger-on-test-fail
  needs:
    - job: test-image-standard
      artifacts: false

