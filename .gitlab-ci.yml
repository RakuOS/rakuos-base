# ============================================================
# RPM DB Stress Tests + Immediate Failure Response
# ============================================================
# Requires group CI/CD variables:
#   TRIGGER_TOKEN_BASE  — pipeline trigger token for this project
#   GITLAB_API_TOKEN    — api-scoped token for pipeline cancellation

.image-test-job:
  extends: .buildah-job
  timeout: 3 hours
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

test-image-standard:
  extends: .image-test-job
  stage: test
  needs:
    - job: build-push-base
      artifacts: false
  script:
    - |
      set -euo pipefail
      IMAGE_REF="${IMAGE_REGISTRY_QUAY}:${BRANCH_SLUG}"
      buildah login -u "${QUAY_USER}" -p "${QUAY_TOKEN}" quay.io
      buildah pull "docker://${IMAGE_REF}"
      CTR=$(buildah from "${IMAGE_REF}")

      echo "=== Image stress test: Justfile + Anaconda packages ==="
      buildah run --isolation chroot --network host "${CTR}" -- \
        rum install -y --allowerasing \
          --enable-repo=fedora-cisco-openh264 \
          dracut-live livesys-scripts fuse-overlayfs \
          anaconda-live libblockdev-btrfs libblockdev-lvm libblockdev-dm \
          qrencode yad

      buildah rm "${CTR}" || true
      echo "Image stress test passed."

test-image-nvidia:
  extends: .image-test-job
  stage: test
  needs:
    - job: build-push-nvidia
      artifacts: false
  script:
    - |
      set -euo pipefail
      IMAGE_REF="${IMAGE_REGISTRY_QUAY_NVIDIA}:${BRANCH_SLUG}"
      buildah login -u "${QUAY_USER}" -p "${QUAY_TOKEN}" quay.io
      buildah pull "docker://${IMAGE_REF}"
      CTR=$(buildah from "${IMAGE_REF}")

      echo "=== Image stress test: Justfile + Anaconda packages ==="
      buildah run --isolation chroot --network host "${CTR}" -- \
        rum install -y --allowerasing \
          --enable-repo=fedora-cisco-openh264 \
          dracut-live livesys-scripts fuse-overlayfs \
          anaconda-live libblockdev-btrfs libblockdev-lvm libblockdev-dm \
          qrencode yad

      echo "=== Image stress test: NVIDIA packages ==="
      buildah run --isolation chroot --network host "${CTR}" -- \
        bash -c 'for pkg in nvidia-gpu-firmware mesa-vulkan-drivers; do rum reinstall -y --allowerasing "$pkg" || rum install -y --allowerasing "$pkg"; done'

      buildah rm "${CTR}" || true
      echo "Image stress test (NVIDIA) passed."

