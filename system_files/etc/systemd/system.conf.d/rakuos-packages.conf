# RakuOS package root PATH for system services.
# Ensures system daemons installed via 'rakuos install' can be found by ExecStart
# when specified without a full path.
[Manager]
DefaultEnvironment=PATH=/var/lib/rakuos/packages/usr/bin:/var/lib/rakuos/packages/usr/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
