# RakuOS DKMS configuration drop-in.
# Loaded after /etc/dkms/framework.conf so these settings survive dkms package updates.

# Use lld and disable Polly re-optimization — the p03 kernel is already built with Polly.
# Polly is an LLVM/clang pass, toggled via -mllvm (p03 is built with clang);
# -fno-polly is a plain clang argument that doesn't exist and hard-fails the build.
MAKE_ARGS="LD=ld.lld"

# Sign modules with the per-machine MOK key generated at install time.
try_sign_modules=true
mok_signing_key=/var/lib/rakuos-user-MOK/mok.key
mok_certificate=/var/lib/rakuos-user-MOK/mok.pem

# Load modules immediately after a successful DKMS build.
modprobe_on_install="true"

# Disable post-transaction dracut regeneration — dracut does not work on ostree.
post_transaction=""