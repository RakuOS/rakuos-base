# Default tuned profile for RakuOS desktop images.
#
# recommend.d files are NOT executable scripts — tuned's ProfileRecommender
# parses them as INI, matching each section's keywords (virt=, system=, etc)
# against the running system and using the first section (sorted by
# filename across /usr/lib/tuned/recommend.d and /etc/tuned/recommend.d
# combined) whose keywords all match. A section with no keywords always
# matches, so this unconditionally recommends "desktop" ahead of the stock
# rules in 50-tuned.conf. Bump the "00-" prefix if a more specific profile
# needs to take priority later.

[desktop]
