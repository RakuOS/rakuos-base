<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  RakuOS default fonts: Inter for sans-serif, Maple Mono NF for monospace.

  <prefer> prepends in front of the generic family, so the file that loads
  first wins. This file must sort before 56-google-noto-sans-vf.conf and
  56-google-noto-sans-mono-vf.conf, but after 50-user.conf and 51-local.conf
  so per-user and local.conf overrides still take precedence.

  Only the family order changes. Scripts that Inter and Maple Mono NF do not
  cover (CJK, Arabic, Indic, ...) still fall back to Noto through the language
  and charset matching in the later google-noto files.

  plymouth-populate-initrd also uses the default sans-serif and monospace
  fonts for Plymouth.ttf and Plymouth-monospace.ttf in the initramfs.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Maple Mono NF</family>
    </prefer>
  </alias>
</fontconfig>
